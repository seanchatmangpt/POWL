name: POWL 2.0 research contract

on:
  pull_request:
    paths:
      - "powl/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "RESEARCH_ALIGNMENT.md"
      - ".github/workflows/research-contract.yml"
  push:
    branches: [main, "agent/spiff-powl-concurrency"]
    paths:
      - "powl/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "RESEARCH_ALIGNMENT.md"
      - ".github/workflows/research-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powl-research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pip check
      - run: python -m pytest tests/test_powl_v2_research_contract.py tests/test_spiff_execution.py tests/test_togaf_enterprise.py tests/test_enterprise_lifecycle.py tests/test_ecosystem_integration.py
      - run: python -m compileall -q powl tests
