name: Lean

on:
  push:
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: false

      - name: Resolve dependencies and build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            lake update
            lake exe cache get
            lake build --wfail
          } 2>&1 | tee lean-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lean-build-log
          path: lean-build.log
          if-no-files-found: error

      - name: Enforce kernel build
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Independent environment verification
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false

      - name: Run formalization receipt
        run: lake exe powlVerifier
