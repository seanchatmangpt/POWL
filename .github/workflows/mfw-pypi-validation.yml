name: mfw-pypi-validation-capsule

on:
  push:
    branches: ["validation/mfw-pypi-planning-5e9b3c41"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CAPSULE_DIR: validation/mfw-pypi-planning/capsule
  MANIFEST: validation/mfw-pypi-planning/manifest.json
  MFW_HEAD_SHA: 5e9b3c41c1f4aa6de9522828716ffe41e70b760b

jobs:
  capsule-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Admit byte-identical MFW source projection
        shell: bash
        run: |
          set -euo pipefail
          python - "$MANIFEST" "$CAPSULE_DIR" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys

          manifest_path = Path(sys.argv[1])
          capsule = Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text())
          assert manifest["source_head_sha"] == "5e9b3c41c1f4aa6de9522828716ffe41e70b760b"
          assert manifest["source_tree_sha"] == "6adb0f95b867d50fa6199e5516f06dfbb677cefc"
          for relative, expected in manifest["files"].items():
              path = capsule / relative
              data = path.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              git_blob = subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()
              assert sha256 == expected["sha256"], (relative, sha256, expected)
              assert git_blob == expected["git_blob_sha1"], (relative, git_blob, expected)
          print(json.dumps({
              "status": "ALIVE",
              "source_head_sha": manifest["source_head_sha"],
              "source_tree_sha": manifest["source_tree_sha"],
              "verified_files": len(manifest["files"]),
          }, sort_keys=True))
          PY

  unit-and-pyperplan-e2e:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact PyPI planning dependencies
        run: python -m pip install --disable-pip-version-check "$GITHUB_WORKSPACE/$CAPSULE_DIR[pyperplan]"
      - name: Execute source tests
        working-directory: ${{ github.workspace }}/validation/mfw-pypi-planning/capsule
        run: python -m unittest discover -s tests -v
      - name: Execute real PDDL planning boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/run"
          mfw-pypi-planner catalog > "$RUNNER_TEMP/run/catalog.json"
          mfw-pypi-planner solve \
            --domain "$GITHUB_WORKSPACE/$CAPSULE_DIR/tests/fixtures/domain.pddl" \
            --problem "$GITHUB_WORKSPACE/$CAPSULE_DIR/tests/fixtures/problem.pddl" \
            --plan "$RUNNER_TEMP/run/candidate.plan" \
            --engine pyperplan \
            --mode classical \
            --timeout 30 \
            > "$RUNNER_TEMP/run/result.json"
          test -s "$RUNNER_TEMP/run/candidate.plan"
          python - "$RUNNER_TEMP/run/catalog.json" "$RUNNER_TEMP/run/result.json" "$RUNNER_TEMP/run/candidate.plan" <<'PY'
          import json
          from pathlib import Path
          import sys
          catalog = json.loads(Path(sys.argv[1]).read_text())
          result = json.loads(Path(sys.argv[2]).read_text())
          candidate = Path(sys.argv[3]).read_text().strip()
          assert catalog["distributions"]["unified-planning"] == "1.3.0", catalog
          assert catalog["distributions"]["up-pyperplan"] is not None, catalog
          assert any(
              engine["name"] == "pyperplan"
              and "oneshot_planner" in engine["operations"]
              for engine in catalog["engines"]
          ), catalog
          assert result["status"] == "found", result
          assert result["step_count"] == 1, result
          assert candidate == "(finish)", candidate
          print(json.dumps({"status": "ALIVE", "candidate": candidate, "run": result}, sort_keys=True))
          PY

  official-engine-closure:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Unified Planning engine federation from PyPI
        run: python -m pip install --disable-pip-version-check "$GITHUB_WORKSPACE/$CAPSULE_DIR[engines]"
      - name: Verify registered operation closure
        shell: bash
        run: |
          set -euo pipefail
          mfw-pypi-planner catalog > "$RUNNER_TEMP/catalog.json"
          python - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text())
          expected = {
              "up-pyperplan", "up-tamer", "up-enhsp", "up-fast-downward",
              "up-lpg", "up-fmap", "up-aries", "up-symk",
          }
          missing = sorted(
              name for name in expected
              if value["distributions"].get(name) is None
          )
          assert not missing, {"missing_distributions": missing, "catalog": value}
          planners = [
              engine for engine in value["engines"]
              if "oneshot_planner" in engine["operations"]
          ]
          assert len(planners) >= 6, planners
          print(json.dumps({"status": "ALIVE", "oneshot_planners": planners}, sort_keys=True))
          PY

  explicit-community-admission:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: tamerlite
            args: --register tamerlite=tamerlite.engine:TamerLite
            distribution: tamerlite
          - extra: paraspace
            args: --load-module up_paraspace
            distribution: up-paraspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install explicitly admitted community engine
        run: python -m pip install --disable-pip-version-check "$GITHUB_WORKSPACE/$CAPSULE_DIR[${{ matrix.extra }}]"
      - name: Verify explicit registration receipt
        shell: bash
        run: |
          set -euo pipefail
          mfw-pypi-planner catalog ${{ matrix.args }} > "$RUNNER_TEMP/catalog.json"
          python - "$RUNNER_TEMP/catalog.json" "${{ matrix.distribution }}" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text())
          assert value["distributions"][sys.argv[2]] is not None, value
          assert (
              value["plugin_admission"]["loaded_modules"]
              or value["plugin_admission"]["registered_engines"]
          ), value
          print(json.dumps({"status": "ALIVE", "catalog": value}, sort_keys=True))
          PY

  spiderplan-registration:
    needs: capsule-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Spiderplan PyPI distribution
        run: python -m pip install --disable-pip-version-check "$GITHUB_WORKSPACE/$CAPSULE_DIR[tamp]"
      - name: Verify registration only
        shell: bash
        run: |
          set -euo pipefail
          mfw-pypi-planner catalog --load-module up_spiderplan > "$RUNNER_TEMP/catalog.json"
          python - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text())
          assert value["distributions"]["up-spiderplan"] is not None, value
          assert any("spider" in engine["name"].lower() for engine in value["engines"]), value
          print(json.dumps({"status": "ALIVE", "catalog": value}, sort_keys=True))
          PY
