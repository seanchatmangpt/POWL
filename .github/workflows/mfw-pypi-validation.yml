name: mfw-pypi-validation-capsule

on:
  push:
    branches: ["validation/mfw-pypi-planning-5e9b3c41"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CAPSULE_SHA256: 0b809d52aa61bb6b5cfb7bb6440d805e3b6d95b53aa9b7991e52070c765bab92
  MFW_HEAD_SHA: 5e9b3c41c1f4aa6de9522828716ffe41e70b760b

jobs:
  unit-and-pyperplan-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Admit exact MFW source capsule
        shell: bash
        run: |
          set -euo pipefail
          base64 -d validation/mfw-pypi-planning/mfw-pypi-planner.tar.gz.b64 > "$RUNNER_TEMP/capsule.tar.gz"
          echo "$CAPSULE_SHA256  $RUNNER_TEMP/capsule.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/capsule"
          tar -xzf "$RUNNER_TEMP/capsule.tar.gz" -C "$RUNNER_TEMP/capsule"
      - name: Install exact PyPI planning dependencies
        run: python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[pyperplan]"
      - name: Execute source tests
        working-directory: ${{ runner.temp }}/capsule
        run: python -m unittest discover -s tests -v
      - name: Execute real PDDL planning boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/run"
          mfw-pypi-planner catalog > "$RUNNER_TEMP/run/catalog.json"
          mfw-pypi-planner solve \
            --domain "$RUNNER_TEMP/capsule/tests/fixtures/domain.pddl" \
            --problem "$RUNNER_TEMP/capsule/tests/fixtures/problem.pddl" \
            --plan "$RUNNER_TEMP/run/candidate.plan" \
            --engine pyperplan \
            --mode classical \
            --timeout 30 \
            > "$RUNNER_TEMP/run/result.json"
          test -s "$RUNNER_TEMP/run/candidate.plan"
          python - "$RUNNER_TEMP/run/catalog.json" "$RUNNER_TEMP/run/result.json" <<'PY'
          import json, pathlib, sys
          catalog = json.loads(pathlib.Path(sys.argv[1]).read_text())
          result = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert catalog["distributions"]["unified-planning"] == "1.3.0", catalog
          assert catalog["distributions"]["up-pyperplan"] is not None, catalog
          assert any(e["name"] == "pyperplan" and "oneshot_planner" in e["operations"] for e in catalog["engines"]), catalog
          assert result["status"] == "found", result
          assert result["step_count"] == 1, result
          assert pathlib.Path(sys.argv[2]).with_name("candidate.plan").read_text().strip() == "(finish)"
          PY

  official-engine-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Admit exact MFW source capsule
        shell: bash
        run: |
          set -euo pipefail
          base64 -d validation/mfw-pypi-planning/mfw-pypi-planner.tar.gz.b64 > "$RUNNER_TEMP/capsule.tar.gz"
          echo "$CAPSULE_SHA256  $RUNNER_TEMP/capsule.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/capsule"
          tar -xzf "$RUNNER_TEMP/capsule.tar.gz" -C "$RUNNER_TEMP/capsule"
      - name: Install official Unified Planning engine federation from PyPI
        run: python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[engines]"
      - name: Verify registered operation closure
        shell: bash
        run: |
          set -euo pipefail
          mfw-pypi-planner catalog > "$RUNNER_TEMP/catalog.json"
          python - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = {"up-pyperplan", "up-tamer", "up-enhsp", "up-fast-downward", "up-lpg", "up-fmap", "up-aries", "up-symk"}
          missing = sorted(name for name in expected if value["distributions"].get(name) is None)
          assert not missing, {"missing_distributions": missing, "catalog": value}
          planners = [e for e in value["engines"] if "oneshot_planner" in e["operations"]]
          assert len(planners) >= 6, planners
          PY

  explicit-community-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: tamerlite
            args: --register tamerlite=tamerlite.engine:TamerLite
            distribution: tamerlite
          - extra: paraspace
            args: --load-module up_paraspace
            distribution: up-paraspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Admit exact MFW source capsule
        shell: bash
        run: |
          set -euo pipefail
          base64 -d validation/mfw-pypi-planning/mfw-pypi-planner.tar.gz.b64 > "$RUNNER_TEMP/capsule.tar.gz"
          echo "$CAPSULE_SHA256  $RUNNER_TEMP/capsule.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/capsule"
          tar -xzf "$RUNNER_TEMP/capsule.tar.gz" -C "$RUNNER_TEMP/capsule"
      - name: Install explicitly admitted community engine
        run: python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[${{ matrix.extra }}]"
      - name: Verify explicit registration receipt
        shell: bash
        run: |
          set -euo pipefail
          mfw-pypi-planner catalog ${{ matrix.args }} > "$RUNNER_TEMP/catalog.json"
          python - "$RUNNER_TEMP/catalog.json" "${{ matrix.distribution }}" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["distributions"][sys.argv[2]] is not None, value
          assert value["plugin_admission"]["loaded_modules"] or value["plugin_admission"]["registered_engines"], value
          PY

  spiderplan-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Admit exact MFW source capsule
        shell: bash
        run: |
          set -euo pipefail
          base64 -d validation/mfw-pypi-planning/mfw-pypi-planner.tar.gz.b64 > "$RUNNER_TEMP/capsule.tar.gz"
          echo "$CAPSULE_SHA256  $RUNNER_TEMP/capsule.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/capsule"
          tar -xzf "$RUNNER_TEMP/capsule.tar.gz" -C "$RUNNER_TEMP/capsule"
      - name: Install Spiderplan PyPI distribution
        run: python -m pip install --disable-pip-version-check "$RUNNER_TEMP/capsule[tamp]"
      - name: Verify registration only
        shell: bash
        run: |
          set -euo pipefail
          mfw-pypi-planner catalog --load-module up_spiderplan > "$RUNNER_TEMP/catalog.json"
          python - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["distributions"]["up-spiderplan"] is not None, value
          assert any("spider" in engine["name"].lower() for engine in value["engines"]), value
          PY
