name: Lean Independent Checkers

on:
  push:
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/lean-independent.yml"
  pull_request:
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/lean-independent.yml"

concurrency:
  group: lean-independent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  independent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install elan and pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Build admitted environment
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build POWL --wfail

      - name: Run bundled leanchecker
        shell: bash
        run: |
          set -euo pipefail
          lake env leanchecker

      - name: Build independent nanoda checker
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/leanprover/lean4export.git _lean4export
          cp lean-toolchain _lean4export/lean-toolchain
          (cd _lean4export && lake build)
          git clone --depth 1 --branch debug https://github.com/ammkrn/nanoda_lib.git _nanoda_lib
          (cd _nanoda_lib && cargo build --release)

      - name: Export and check POWL environment
        shell: bash
        run: |
          set -euo pipefail
          lake env _lean4export/.lake/build/bin/lean4export POWL > _nanoda_export.txt
          cat > _nanoda_config.json <<'JSON'
          {
            "export_file_path": "_nanoda_export.txt",
            "use_stdin": false,
            "permitted_axioms": ["propext", "Classical.choice", "Quot.sound", "Lean.trustCompiler"],
            "unpermitted_axiom_hard_error": true,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          JSON
          _nanoda_lib/target/release/nanoda_bin _nanoda_config.json
          printf '%s\n' '{"leanchecker":"success","nanoda":"success","sorryAx":"refused","module":"POWL","toolchain":"leanprover/lean4:v4.32.1"}' > independent-checker-receipt.json

      - name: Upload independent checker receipt
        uses: actions/upload-artifact@v7
        with:
          name: lean-independent-checker-receipt
          path: independent-checker-receipt.json
          if-no-files-found: error
